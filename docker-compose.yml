services:
  postgres:
    image: postgres:16-alpine
    container_name: ss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simply_service_db
      POSTGRES_USER: simply_user
      POSTGRES_PASSWORD: simply_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U simply_user -d simply_service_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ss_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ss_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://simply_user:simply_pass@postgres:5432/simply_service_db
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_SOCKET_URL: ""
    container_name: ss_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:80'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ss_network
