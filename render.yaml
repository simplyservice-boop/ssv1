services:
  - type: web
    name: simply-service-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_URL
        value: https://simply-service-api.onrender.com
      - key: WEB_URL
        value: https://simply-service-web.onrender.com
      - key: CORS_ORIGINS
        value: https://simply-service-web.onrender.com,http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:4000
      - key: DATABASE_URL
        fromDatabase:
          name: simply-service-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: simply-service-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: apikey
      - key: SMTP_PASS
        value: ""
      - key: EMAIL_FROM
        value: noreply@simplyservice.io
      - key: EMAIL_FROM_NAME
        value: Simply Service
      - key: SOCKET_CORS_ORIGIN
        value: https://simply-service-web.onrender.com
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: STRIPE_PUBLISHABLE_KEY
        value: ""
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        value: simply-service-assets

  - type: web
    name: simply-service-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://simply-service-api.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://simply-service-api.onrender.com
      - key: VITE_MAPBOX_TOKEN
        value: ""

  - type: redis
    name: simply-service-redis
    plan: free

databases:
  - name: simply-service-db
    databaseName: simply_service_db
    user: simply_user
    plan: free
